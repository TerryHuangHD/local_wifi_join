# Publishes to pub.dev when a tag like v1.2.3 is pushed.
#
# One-time setup: publish the first version manually (`flutter pub publish`),
# then enable "Automated publishing" on pub.dev (Admin tab) for this repository
# with tag pattern `v{{version}}` and, optionally, required environment `pub.dev`.
name: Publish to pub.dev

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'

jobs:
  # The complete CI suite (Dart, Android, iOS SwiftPM and CocoaPods) for the
  # tagged commit; nothing is published unless it passes.
  ci:
    uses: ./.github/workflows/ci.yaml

  publish:
    needs: ci
    runs-on: ubuntu-latest
    environment: pub.dev
    permissions:
      id-token: write # pub.dev authenticates the workflow via OIDC
    steps:
      - uses: actions/checkout@v4
      # Provides the OIDC credentials for `pub publish`.
      - uses: dart-lang/setup-dart@v1
      - uses: subosito/flutter-action@v2
        with:
          # Keep in sync with .fvmrc.
          flutter-version: 3.47.4
      - run: flutter pub get
      - run: flutter pub publish --force
